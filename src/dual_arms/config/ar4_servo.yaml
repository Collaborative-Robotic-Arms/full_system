# The critical fix: All parameters must be nested under 'moveit_servo'
moveit_servo:
  # The Planning Group (Must match your SRDF)
  move_group_name: ar_manipulator
  
  # The Frame your controller sends commands in (Camera Optical Frame)
  robot_link_command_frame: ar4_camera_link
  
  # Command Types
  command_in_type: "speed_units" # Input is m/s and rad/s
  command_out_type: "trajectory_msgs/JointTrajectory" 
  
  # === SMOOTHING FIX ===
  # Lower this value to increase smoothing.
  # 2.0 = Reactive (Fast)
  # 0.5 = Very Smooth (Slow ramp up). 
  # Using 0.5 helps avoid "Acceleration Limit" violations at startup.
  low_pass_filter_coeff: 0.5 
  
  # Safety & Timing
  publish_period: 0.033  # ~30Hz
  incoming_command_timeout: 1.0  # Tolerant of lag
  
  # === SINGULARITY FIXES ===
  # Allow operation in messy math areas
  lower_singularity_threshold: 200.0
  hard_stop_singularity_threshold: 400.0
  
  # Collision Checking (Keep false for initial tuning)
  check_collisions: false
  
  # Scaling factors
  scale:
    linear: 1.0
    rotational: 1.0
    joint: 1.0