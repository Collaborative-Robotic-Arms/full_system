# FILE: dual_arms/config/moveit_controllers.yaml (Proposed Edits)

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - ar4_trajectory_controller
    - irb120_controller
    - dual_arms_controller         # Combined Group

  # ARM MAPPINGS (No Change, Already Correct)
  ar4_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - ar4_joint_1
      - ar4_joint_2
      - ar4_joint_3
      - ar4_joint_4
      - ar4_joint_5
      - ar4_joint_6

  irb120_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

  # GRIPPER MAPPINGS (CRITICAL EDITS: Use FJT action_ns)
  # NOTE: We set the type to FollowJointTrajectory and the action_ns to the controller name
  # as that is often the FJT action topic used by simple effort controllers.



dual_arms_controller:
  type: FollowJointTrajectory
  default: true 
  joints:
    # AR4 Joints
    - ar4_joint_1
    - ar4_joint_2
    - ar4_joint_3
    - ar4_joint_4
    - ar4_joint_5
    - ar4_joint_6

    # IRB120 Joints
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

  dependencies:
    - ar4_trajectory_controller
    - irb120_controller

