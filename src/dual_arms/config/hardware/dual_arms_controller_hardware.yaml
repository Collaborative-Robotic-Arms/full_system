# FILE: dual_arms/config/dual_controllers.yaml

# 1. CONTROLLER MANAGER CONFIGURATION
controller_manager:
  ros__parameters:
    update_rate: 60  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Existing Arm Controllers (Assuming trajectory type)
    ar4_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    irb120_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# 3. TRAJECTORY ARM PARAMETERS (Position Control)
ar4_trajectory_controller:
  ros__parameters:
    joints:
      - ar4_joint_1
      - ar4_joint_2
      - ar4_joint_3
      - ar4_joint_4
      - ar4_joint_5
      - ar4_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      ar4_joint_1: { trajectory: 0.2, goal: 0.02 }
      ar4_joint_2: { trajectory: 0.2, goal: 0.02 }
      ar4_joint_3: { trajectory: 0.2, goal: 0.02 }
      ar4_joint_4: { trajectory: 0.2, goal: 0.02 }
      ar4_joint_5: { trajectory: 0.2, goal: 0.02 }
      ar4_joint_6: { trajectory: 0.2, goal: 0.02 }

    gains: # Required because we're controlling a velocity interface
      ar4_joint_1: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 } # Smaller 'p' term, since ff term does most of the work
      ar4_joint_2: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      ar4_joint_3: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      ar4_joint_4: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      ar4_joint_5: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      ar4_joint_6: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }

    velocity_ff:
      ar4_joint_1: 1.0
      ar4_joint_2: 1.0
      ar4_joint_3: 1.0
      ar4_joint_4: 1.0
      ar4_joint_5: 1.0
      ar4_joint_6: 1.0


irb120_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
