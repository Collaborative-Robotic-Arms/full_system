# FILE: dual_arms/config/dual_controllers.yaml

# 1. CONTROLLER MANAGER CONFIGURATION
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Existing Arm Controllers (Assuming trajectory type)
    ar4_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    irb120_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # GRIPPER CONTROLLERS (Synchronizing Names)
    irb120_gripper_controller: # ABB Gripper (Effort Group)
      type: joint_trajectory_controller/JointTrajectoryController
    ar4_gripper_controller: # AR4 Gripper (Effort Group)
      type: joint_trajectory_controller/JointTrajectoryController

# 3. TRAJECTORY ARM PARAMETERS (Position Control)
ar4_trajectory_controller:
  ros__parameters:
    joints:
      - ar4_joint_1
      - ar4_joint_2
      - ar4_joint_3
      - ar4_joint_4
      - ar4_joint_5
      - ar4_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 100.0
    allow_nonzero_velocity_at_trajectory_end: true


irb120_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 100.0

# 4. ABB GRIPPER (Effort Group Control)
irb120_gripper_controller:
  ros__parameters:
    joints:
      - gripper_ABB_Gripper_Finger_1_Joint
      - gripper_ABB_Gripper_Finger_2_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# 5. AR4 GRIPPER (Effort Group Control)
ar4_gripper_controller:
  ros__parameters:
    joints:
      - ar4_gripper_jaw1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity