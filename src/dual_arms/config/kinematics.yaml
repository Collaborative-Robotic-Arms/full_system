ar_manipulator:
  # ==========================================================
  # ACTIVE SOLVER: KDL (Numerical)
  # Recommended for Visual Servoing to avoid Error -31.
  # It finds "close enough" solutions even with sensor noise.
  # ==========================================================
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

  # ==========================================================
  # PREVIOUS SOLVER: IKFast (Analytical)
  # Causes Error -31 (No IK Solution) in Servo because it fails
  # if the requested pose is not mathematically exact.
  # ==========================================================
  # kinematics_solver: ar4_ar_manipulator/IKFastKinematicsPlugin
  # kinematics_solver_search_resolution: 0.05
  # kinematics_solver_timeout: 0.05

irb120_arm:
  # ==========================================================
  # ACTIVE SOLVER: KDL (Numerical)
  # ==========================================================
  # kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # kinematics_solver_search_resolution: 0.005
  # kinematics_solver_timeout: 0.05

  # ==========================================================
  # PREVIOUS SOLVER: IKFast (Analytical)
  # ==========================================================
  kinematics_solver: irb120_irb120_arm/IKFastKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

ar_manipulator_servo:
  # Use KDL ONLY for servoing
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_timeout: 0.005
  kinematics_solver_search_resolution: 0.005