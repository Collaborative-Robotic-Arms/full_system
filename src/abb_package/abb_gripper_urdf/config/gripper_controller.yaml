# FILE: config/gripper_controller.yaml

# 1. Controller Manager Configuration
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_controller:
      # SWITCHED BACK TO JOINT GROUP EFFORT CONTROLLER
      type: effort_controllers/JointGroupEffortController

# 2. Controller-Specific Configuration
irb120_gripper_controller:
  ros__parameters:
    # CRITICAL: List BOTH joints for the controller to command
    joints:
      - gripper_ABB_Gripper_Finger_1_Joint
      - gripper_ABB_Gripper_Finger_2_Joint
    
    # We command effort directly
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    # Joint Group Controllers typically do NOT use internal PID gains, 
    # but we list them for stability.
    gains:
      gripper_ABB_Gripper_Finger_1_Joint: {p: 0.0, i: 0.0, d: 0.0}
      gripper_ABB_Gripper_Finger_2_Joint: {p: 0.0, i: 0.0, d: 0.0}
    
